workflows:

  # ── iOS build (sideload via AltStore) ─────────────────────────────────────
  ios-development:
    name: iOS Development Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: 3.41.8
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: com.unza.unza_z_chat
      vars:
        BUNDLE_ID: com.unza.unza_z_chat
        XCODE_SCHEME: Runner
        XCODE_WORKSPACE: ios/Runner.xcworkspace
      groups:
        - firebase_ios        # GOOGLE_SERVICE_INFO_PLIST
        - apple_credentials   # APP_STORE_CONNECT_APPLE_ID, APP_STORE_CONNECT_PASSWORD, APPLE_UDID

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Set up GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > $CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install && cd ..

      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --export-method development

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - innocenttembo60@gmail.com
        notify:
          success: true
          failure: true

  # ── Android build ──────────────────────────────────────────────────────────
  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      flutter: 3.41.8

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - innocenttembo60@gmail.com
        notify:
          success: true
          failure: true
