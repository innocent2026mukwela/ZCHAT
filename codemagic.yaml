workflows:

  # ── iOS build (unsigned IPA → sideload via AltStore with free Apple ID) ─────
  ios-development:
    name: iOS Development Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Codemagic → Teams → Environment variables → group name: supabase
      # Required vars: SUPABASE_URL, SUPABASE_ANON_KEY
      # Optional: SUPABASE_BUCKET (defaults to zchat-media in the build script)
      groups:
        - supabase
      flutter: 3.41.8
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.unza.unza_z_chat
        XCODE_SCHEME: Runner
        XCODE_WORKSPACE: ios/Runner.xcworkspace

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      # GoogleService-Info.plist is committed in the repo (ios/Runner/) and
      # bundled via the Xcode target, so no env-var injection is needed. The
      # previous base64 overwrite step wrote a corrupt/empty plist when the
      # env var was missing, breaking the Xcode build with a PropertyList error.
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install && cd ..

      # Media uploads: vars come from the `supabase` environment group.
      - name: Build iOS (no code sign)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=SUPABASE_BUCKET=${SUPABASE_BUCKET:-zchat-media}

      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/ZCHAT-unsigned.ipa Payload
          cd ../../..

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - innocenttembo60@gmail.com
        notify:
          success: true
          failure: true

  # ── Android build ──────────────────────────────────────────────────────────
  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      # Codemagic → Teams → Environment variables → group name: supabase
      # Required vars: SUPABASE_URL, SUPABASE_ANON_KEY
      # Optional: SUPABASE_BUCKET (defaults to zchat-media in the build script)
      groups:
        - supabase
      flutter: 3.41.8

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      # Media uploads: vars come from the `supabase` environment group.
      - name: Build Android APK
        script: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=SUPABASE_BUCKET=${SUPABASE_BUCKET:-zchat-media}

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - innocenttembo60@gmail.com
        notify:
          success: true
          failure: true
