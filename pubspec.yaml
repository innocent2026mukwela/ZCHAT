name: unza_z_chat
description: "UnZA z CHAT – Integrated campus communication, virtual classroom and AI study companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Icons & fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^14.6.2

  # State management
  provider: ^6.1.2

  # UI extras
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  badges: ^3.1.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.0
  intl: ^0.19.0
  timeago: ^3.6.1

  # Storage / local
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Utils
  uuid: ^4.5.1
  image_picker: ^1.1.2

  # Voice
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  record: ^6.0.0
  just_audio: ^0.10.5

  # File picking
  file_picker: ^10.3.8

  # Contacts
  flutter_contacts: ^1.1.9+1
  permission_handler: ^12.0.1

  # Calls
  zego_uikit_prebuilt_call: ^4.24.1

  # Notifications / planner
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # QR code
  qr_flutter: ^4.1.0

  # URL / PDF opening
  url_launcher: ^6.3.1

  # Auth
  pinput: ^5.0.0
  intl_phone_field: ^3.2.0
  http: ^1.2.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
