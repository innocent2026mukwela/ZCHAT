name: unza_z_chat
description: "UnZA z CHAT – Integrated campus communication, virtual classroom and AI study companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^14.6.2

  # State management
  provider: ^6.1.2

  # UI extras
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  gpt_markdown: ^1.0.19   # renders AI (Claude) markdown output
  badges: ^3.1.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.0
  intl: ^0.19.0
  timeago: ^3.6.1

  # Storage / local
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Utils
  uuid: ^4.5.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2   # share current location in chat
  connectivity_plus: ^6.1.4

  # Voice
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  record: ^6.0.0
  just_audio: ^0.10.5

  # File picking
  file_picker: ^10.3.8

  # Contacts
  flutter_contacts: ^2.1.0
  permission_handler: ^12.0.1

  # Calls
  zego_uikit_prebuilt_call: ^4.24.1

  # Notifications / planner
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # QR code
  qr_flutter: ^4.1.0

  # URL / PDF opening (papers open in the device's PDF app / browser)
  url_launcher: ^6.3.1

  # Auth
  pinput: ^5.0.0
  intl_phone_field: ^3.2.0
  http: ^1.2.2

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Biometrics / chat lock
  local_auth: ^2.3.0

  # QR code scanner
  mobile_scanner: ^6.0.0

  # Video playback (status + video messages)
  video_player: ^2.9.2

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    # Brand display typeface — the ZCHAT wordmark + named-screen header titles.
    # Space Grotesk is a stylish geometric sans with a modern tech character.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    # Alternates kept available for a quick swap.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
